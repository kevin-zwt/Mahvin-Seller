<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mahvin Seller — daily product updates and trend research for your store.">
  <meta name="theme-color" content="#4F46E5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mahvin Seller">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mahvin Seller</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #mahvin-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%);
      transition: opacity 0.4s ease;
    }

    #mahvin-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #mahvin-splash img {
      width: 112px;
      height: 112px;
      border-radius: 30px;
      box-shadow: 0 18px 44px rgba(30, 27, 75, 0.45);
    }

    #mahvin-splash h1 {
      margin: 24px 0 0;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    #mahvin-splash p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.8);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 1.4px;
    }

    .splash-bar {
      margin-top: 32px;
      width: 120px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .splash-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #fff;
      animation: splash-slide 1.1s ease-in-out infinite;
    }

    @keyframes splash-slide {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(350%);
      }
    }
  </style>
</head>
<body>
  <div id="mahvin-splash">
    <img src="icons/Icon-192.png" alt="Mahvin Seller logo">
    <h1>MAHVIN</h1>
    <p>SELLER DAILY</p>
    <div class="splash-bar"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var splash = document.getElementById('mahvin-splash');
      if (!splash) return;

      var hide = function () {
        if (!splash.parentNode) return;
        splash.classList.add('is-hidden');
        window.setTimeout(function () {
          splash.remove();
        }, 420);
      };

      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          observer.disconnect();
          window.setTimeout(hide, 120);
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
      window.setTimeout(hide, 8000);
    })();
  </script>
</body>
</html>
